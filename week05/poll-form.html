<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form - User Poll</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>


<body>
    <h1>WDD 130 | HTML Form - User Poll</h1>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <label for="fullname"> Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
                <br>
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail" required>
            </fieldset>
            <fieldset>
                <legend>Questions</legend>
                <label for="quantity">What is your favorite internet browser</label>
                <select name="Browser" id="Browser">
                    <option value="chrome">Chrome</option>
                    <option value="safari">Safari</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="other">Other</option>
                </select>
                <br>
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" name="pet" id="pet">
                <br>
                <label for="feedback">List all places you have lived:</label>
                <textarea name="feedback" id="feedback" rows="4"
                  placeholder="Toronto-Canada"></textarea>
            </fieldset>
        </form>
        <button type="submit">Submit Poll</button>
    </main>
    <footer>
        <p>©️2026 | HTML-Form - User Poll Activity | Alexander Arellano</p>
    </footer>
</body>

</html>
