<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Whitewater Rafting</title>
    <meta name="description"
      content="Contact Whitewater Rafting for general inquiries, reservation questions, or website suggestions. Find our contact information, location, and team.">
    <meta name="author" content="Alexander Arellano">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.jpg" alt="Whitewater Rafting Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-main">

        <section class="company-info">
            <h1>White Water Rafting Company</h1>

            <p>
                <strong>Address:</strong><br>
                123 Main River Street<br>
                Kolob, California
            </p>

            <p>
                <strong>Phone:</strong><br>
                +1 999 999 9999
            </p>

            <p>
                <strong>Email:</strong><br>
                info@whitewater.com
            </p>
        </section>

        <section class="contact-section">

            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d5006.963684896595!2d-78.23487023251795!3d0.22116856900713405!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1ses!2sec!4v1791507703560!5m2!1ses!2sec"
                  width="600" height="450" title="Whitewater Rafting Company Location"
                  allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>

            <form class="contact-form" action="#" method="post">

                <div class="form-item">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your name"
                      required>
                </div>

                <div class="form-item">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email"
                      required>
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>

                    <label>
                        <input type="radio" name="purpose" value="general-inquiry" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation-question">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="website-suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type your message here"
                      rows="5" required></textarea>
                </div>

                <div class="newsletter">
                    <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                    <label for="subscribe">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Get in Touch!</button>

            </form>

        </section>

        <section class="employee-section">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-profiles">

                <figure>
                    <img src="images/employee1.jpg" alt="Customer service representative">
                    <figcaption>Customer Service Representative</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Reservations manager">
                    <figcaption>Reservations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Rafting operations manager">
                    <figcaption>Rafting Operations Manager</figcaption>
                </figure>

            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 Whitewater Rafting | Alexander Arellano</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
```
